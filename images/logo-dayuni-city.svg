<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Josefin+Sans:wght@300;400&amp;display=swap');
    </style>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#8B9E7C" stroke-width="1.2"/>
  <!-- Inner circle -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#8B9E7C" stroke-width="0.5" opacity="0.5"/>

  <!-- Botanical accent - top branch -->
  <g transform="translate(200, 58)">
    <!-- Center stem -->
    <path d="M0 10 C0 0, 0 -5, 0 -10" fill="none" stroke="#C9A96E" stroke-width="1.2"/>

    <!-- Left leaf -->
    <path d="M-2 5 C-15 -5, -25 -15, -18 -25 C-12 -32, -5 -20, -2 5Z" fill="none" stroke="#C9A96E" stroke-width="1"/>
    <path d="M-2 5 C-12 -8, -18 -18, -18 -25" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.6"/>

    <!-- Right leaf -->
    <path d="M2 5 C15 -5, 25 -15, 18 -25 C12 -32, 5 -20, 2 5Z" fill="none" stroke="#C9A96E" stroke-width="1"/>
    <path d="M2 5 C12 -8, 18 -18, 18 -25" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.6"/>

    <!-- Small left leaf -->
    <path d="M-5 8 C-18 2, -28 -2, -22 -12 C-18 -18, -10 -8, -5 8Z" fill="none" stroke="#C9A96E" stroke-width="0.8"/>

    <!-- Small right leaf -->
    <path d="M5 8 C18 2, 28 -2, 22 -12 C18 -18, 10 -8, 5 8Z" fill="none" stroke="#C9A96E" stroke-width="0.8"/>

    <!-- Small berry/flower -->
    <circle cx="-22" cy="-12" r="3" fill="none" stroke="#C9A96E" stroke-width="0.8"/>
    <circle cx="0" cy="-12" r="2.5" fill="#C9A96E" opacity="0.3"/>
  </g>

  <!-- YR Monogram -->
  <text x="148" y="220" font-family="'Playfair Display', Georgia, serif" font-size="80" font-weight="400" fill="#3A3A3A" letter-spacing="2">Y</text>
  <text x="220" y="220" font-family="'Playfair Display', Georgia, serif" font-size="80" font-weight="400" fill="#3A3A3A" letter-spacing="2">R</text>

  <!-- Brand name -->
  <text x="200" y="380" text-anchor="middle" font-family="'Josefin Sans', 'Helvetica Neue', sans-serif" font-size="28" font-weight="300" fill="#3A3A3A" letter-spacing="12">YUNI RHOSITA</text>

  <!-- Tagline -->
  <text x="200" y="420" text-anchor="middle" font-family="'Josefin Sans', 'Helvetica Neue', sans-serif" font-size="13" font-weight="300" fill="#8A8578" letter-spacing="6">DAYUNI CITY</text>

  <!-- Bottom decorative line -->
  <line x1="150" y1="445" x2="250" y2="445" stroke="#C9A96E" stroke-width="0.5"/>
  <circle cx="200" cy="445" r="2" fill="#C9A96E"/>
</svg>
