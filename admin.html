<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Dayuni City Testimoni</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Josefin+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF7F2;
      --ivory: #FFFDF8;
      --olive: #5B6B4A;
      --olive-dark: #47553A;
      --olive-light: #8B9E7C;
      --gold: #C9A96E;
      --gold-light: #DFC89A;
      --charcoal: #2C2C2C;
      --text: #3A3A3A;
      --text-muted: #8A8578;
      --blush: #F0E6DA;
      --blush-dark: #E2D4C4;
      --white: #FFFFFF;
      --radius: 4px;
      --font-display: 'Playfair Display', serif;
      --font-body: 'Cormorant Garamond', serif;
      --font-sans: 'Josefin Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    .admin-header {
      background: var(--charcoal);
      color: var(--cream);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header h1 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 400;
    }

    .admin-header a {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      text-decoration: none;
    }

    .admin-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .admin-section {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .admin-section h2 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      color: var(--charcoal);
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--blush);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--blush-dark);
      border-radius: var(--radius);
      background: var(--cream);
      color: var(--text);
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--olive-light);
    }

    .form-group textarea { resize: vertical; min-height: 80px; }

    .btn {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-add {
      background: var(--olive);
      color: var(--ivory);
    }

    .btn-add:hover { background: var(--olive-dark); }

    .btn-delete {
      background: transparent;
      color: #c0392b;
      border: 1px solid #e8c4c0;
      padding: 0.4rem 1rem;
      font-size: 0.65rem;
    }

    .btn-delete:hover {
      background: #c0392b;
      color: white;
    }

    .testimonial-list {
      list-style: none;
    }

    .testimonial-item {
      padding: 1.2rem;
      border: 1px solid var(--blush);
      border-radius: var(--radius);
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .testimonial-item-content {
      flex: 1;
    }

    .testimonial-item-text {
      font-style: italic;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .testimonial-item-meta {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .testimonial-item-meta strong {
      color: var(--charcoal);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Messages section */
    .message-item {
      padding: 1.2rem;
      border: 1px solid var(--blush);
      border-radius: var(--radius);
      margin-bottom: 0.8rem;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .message-from {
      font-family: var(--font-display);
      font-weight: 500;
      color: var(--charcoal);
    }

    .message-date {
      font-family: var(--font-sans);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .message-email {
      font-size: 0.85rem;
      color: var(--olive);
      margin-bottom: 0.3rem;
    }

    .message-subject {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 0.5rem;
    }

    .message-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
    }

    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--blush-dark);
    }

    .tab-btn {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.8rem 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: var(--olive);
      border-bottom-color: var(--olive);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-container { padding: 0 1rem; }
      .admin-section { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>Dayuni City — Admin Panel</h1>
    <a href="index.html">Lihat Website</a>
  </header>

  <div class="admin-container">

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="testimoni">Testimoni</button>
      <button class="tab-btn" data-tab="pesan">Pesan Masuk</button>
    </div>

    <!-- Testimonials Tab -->
    <div class="tab-content active" id="tab-testimoni">
      <div class="admin-section">
        <h2>Tambah Testimoni Baru</h2>
        <form id="addTestimonialForm">
          <div class="form-row">
            <div class="form-group">
              <label>Nama Pelanggan</label>
              <input type="text" id="tName" required placeholder="Nama pelanggan">
            </div>
            <div class="form-group">
              <label>Peran / Status</label>
              <input type="text" id="tRole" placeholder="contoh: Pelanggan Setia" value="Pelanggan">
            </div>
          </div>
          <div class="form-group">
            <label>Testimoni</label>
            <textarea id="tText" required placeholder="Tulis testimoni pelanggan..."></textarea>
          </div>
          <div class="form-group">
            <label>Rating (1-5 bintang)</label>
            <select id="tStars">
              <option value="5">5 Bintang</option>
              <option value="4">4 Bintang</option>
              <option value="3">3 Bintang</option>
            </select>
          </div>
          <button type="submit" class="btn btn-add">Tambah Testimoni</button>
        </form>
      </div>

      <div class="admin-section">
        <h2>Daftar Testimoni</h2>
        <ul class="testimonial-list" id="testimonialList"></ul>
      </div>
    </div>

    <!-- Messages Tab -->
    <div class="tab-content" id="tab-pesan">
      <div class="admin-section">
        <h2>Pesan dari Formulir Kontak</h2>
        <div id="messagesList"></div>
      </div>
    </div>
  </div>

  <script>
    // Tab navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // Default testimonials
    const defaultTestimonials = [
      { text: 'Produk dari Dayuni City selalu berkualitas tinggi! Pengiriman cepat dan packaging-nya cantik. Sudah berlangganan dari awal dan tidak pernah kecewa.', author: 'Sari Wulandari', role: 'Pelanggan Setia', stars: 5 },
      { text: 'Saya sangat suka dengan koleksi fashion di Dayuni City. Kualitas bahan premium dengan harga yang sangat terjangkau. Pasti akan belanja lagi!', author: 'Dewi Anggraini', role: 'Fashion Enthusiast', stars: 5 },
      { text: 'Pelayanan Kak Yuni sangat ramah dan responsive. Setiap pertanyaan dijawab dengan cepat. Rekomendasi produknya selalu tepat sesuai kebutuhan saya.', author: 'Rina Permata', role: 'Pelanggan Baru', stars: 5 },
      { text: 'Sudah order berkali-kali dan tidak pernah mengecewakan. Kualitas produk selalu konsisten dan harganya bersahabat. Highly recommended!', author: 'Maya Putri', role: 'Repeat Customer', stars: 5 }
    ];

    let testimonials = JSON.parse(localStorage.getItem('dayuni_testimonials')) || defaultTestimonials;

    function renderList() {
      const list = document.getElementById('testimonialList');
      if (testimonials.length === 0) {
        list.innerHTML = '<div class="empty-state">Belum ada testimoni. Tambahkan yang pertama!</div>';
        return;
      }
      list.innerHTML = testimonials.map((t, i) => `
        <li class="testimonial-item">
          <div class="testimonial-item-content">
            <div class="testimonial-item-text">"${t.text}"</div>
            <div class="testimonial-item-meta"><strong>${t.author}</strong> — ${t.role} — ${'★'.repeat(t.stars)}</div>
          </div>
          <button class="btn btn-delete" onclick="deleteTestimonial(${i})">Hapus</button>
        </li>
      `).join('');
    }

    function deleteTestimonial(index) {
      if (confirm('Hapus testimoni ini?')) {
        testimonials.splice(index, 1);
        localStorage.setItem('dayuni_testimonials', JSON.stringify(testimonials));
        renderList();
      }
    }

    document.getElementById('addTestimonialForm').addEventListener('submit', (e) => {
      e.preventDefault();
      testimonials.push({
        text: document.getElementById('tText').value,
        author: document.getElementById('tName').value,
        role: document.getElementById('tRole').value || 'Pelanggan',
        stars: parseInt(document.getElementById('tStars').value)
      });
      localStorage.setItem('dayuni_testimonials', JSON.stringify(testimonials));
      renderList();
      e.target.reset();
      document.getElementById('tRole').value = 'Pelanggan';
    });

    // Messages
    function renderMessages() {
      const container = document.getElementById('messagesList');
      const messages = JSON.parse(localStorage.getItem('dayuni_messages')) || [];
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state">Belum ada pesan masuk.</div>';
        return;
      }
      container.innerHTML = messages.reverse().map(m => {
        const date = new Date(m.date);
        const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        return `
          <div class="message-item">
            <div class="message-header">
              <span class="message-from">${m.nama}</span>
              <span class="message-date">${dateStr}</span>
            </div>
            <div class="message-email">${m.email}</div>
            ${m.subjek ? `<div class="message-subject">${m.subjek}</div>` : ''}
            <div class="message-body">${m.pesan}</div>
          </div>
        `;
      }).join('');
    }

    renderList();
    renderMessages();
  </script>
</body>
</html>
